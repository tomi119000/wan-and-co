<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スポット詳細 — Wan &amp; Co.</title>
<link rel="stylesheet" href="assets/style.css?v=20261025d">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="map.html" class="backlink">‹ 戻る</a>
      <div class="sub" id="src"></div>
    </header>
    <div id="content"></div>
  </div>

<script src="assets/config.js?v=20261025d"></script>
<script src="assets/data.js?v=20261025d"></script>
<script src="assets/maps.js?v=20261025d"></script>
<script src="assets/gplaces.js?v=20261025d"></script>
<script src="assets/app.js?v=20261025d"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  // 一覧から来た Google 施設は、自社の分類（カテゴリ）を引き継ぐ
  if (id && id.startsWith("gp_") && params.get("cat")) Data.hintPlace(id, { category: params.get("cat") });

  (async () => {
    const user = await Data.ready();
    if (!user) { location.href = "index.html"; return; }
    $("#content").innerHTML = `<div class="empty"><div class="big">🐾</div>読み込み中…</div>`;
    await load();
    mountNav("map");
  })();

  async function load() {
    let d;
    try { d = await Store.detail(id); } catch (e) { d = null; }
    if (!d) {
      $("#content").innerHTML = `<div class="empty"><div class="big">🐾</div>スポットが見つかりませんでした。<br><br><a class="btn btn-ghost" href="map.html">マップへ戻る</a></div>`;
      return;
    }
    render(d);
  }

  function render(d) {
    const p = d.place;
    $("#src").textContent = sourceLabel(p.source);
    const hero = safeCover((d.photos && d.photos[0]) || p.cover || "");
    const gallery = (d.photos || []).map(safeCover).filter(Boolean);
    $("#content").innerHTML = `
      ${hero ? `<img class="hero-img" src="${hero}" alt="">` : `<div class="hero-img" id="heroBox" style="background:#ded9cf center/cover no-repeat"></div>`}
      <div class="pad">
        <div class="eyebrow">${catLabel(p.category)}${p.visibility==="private"?" ・ 🔒非公開":""}</div>
        <h2 class="section" id="pName" style="margin-bottom:8px">${escapeHtml(p.name || "読み込み中…")}</h2>
        <p class="sans" id="pAddr" style="color:var(--muted);margin-top:0">📍 ${escapeHtml(p.address || (p.source === "gplace" ? "" : "住所未登録"))}</p>
        <div class="sans" id="pChips" style="display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px;font-size:14px">
          ${p.indoorOk === true ? `<span style="background:#e8f0e9;color:var(--ok);padding:5px 12px;border-radius:999px;font-weight:600">🐕 店内同伴OK</span>` : ""}
          ${p.indoorOk === false ? `<span style="background:#f3ece9;color:var(--danger);padding:5px 12px;border-radius:999px">店内同伴は不可（テラス等）</span>` : ""}
          ${p.tel ? `<a href="tel:${escapeHtml(p.tel)}" style="background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:5px 12px;border-radius:999px;text-decoration:none">📞 ${escapeHtml(p.tel)}</a>` : ""}
          ${p.website ? `<a href="${escapeHtml(p.website)}" target="_blank" rel="noopener" style="background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:5px 12px;border-radius:999px;text-decoration:none">🔗 ウェブサイト</a>` : ""}
        </div>

        <div class="stat-row" style="margin:16px 0 20px">
          <div class="stat"><div class="num">${p.avg?p.avg.toFixed(1):"–"}</div><div class="lbl">評価</div></div>
          <div class="stat"><div class="num">${p.checkinCount||0}</div><div class="lbl">チェックイン</div></div>
          <div class="stat"><div class="num">${p.reviewCount||0}</div><div class="lbl">口コミ</div></div>
        </div>

        ${p.desc ? `<p>${escapeHtml(p.desc)}</p>` : ""}
        <div id="gExtra"></div>

        <button class="btn btn-gold" id="checkin" style="margin:8px 0 6px" ${d.checkedInToday?"disabled style='opacity:.6'":""}>
          ${d.checkedInToday ? "✓ 本日チェックイン済み" : "✓ ここにチェックインする"}
        </button>
        <button class="btn btn-ghost" id="saveBtn" style="margin:0 0 6px">♡ 保存する</button>
        <p class="hint sans center">同伴ルールを守って、素敵な時間を。</p>

        <div class="card pad" style="margin-top:20px">
          <div class="sans" style="font-weight:600;font-size:15px;margin-bottom:3px">店内へのワンちゃん同伴は？</div>
          <p class="sans" style="font-size:13px;color:var(--muted);margin:0 0 12px">
            訪問された方の情報が、次に行く誰かの助けになります。
          </p>
          <div class="filter-row">
            <button class="toggle-chip" id="repYes">🐕 店内OK</button>
            <button class="toggle-chip" id="repNo">テラスのみ・不可</button>
          </div>
          <p class="sans" id="repCount" style="font-size:12px;color:var(--muted);margin:10px 0 0"></p>
        </div>

        ${gallery.length > 1 ? `
          <h3 class="section" style="font-size:18px;margin-top:24px">フォト</h3>
          <div class="gallery">${gallery.map(u=>`<img src="${u}" alt="">`).join("")}</div>` : ""}

        <h3 class="section" style="font-size:18px;margin-top:26px">場所</h3>
        <div class="card"><div id="mini" style="height:200px"></div></div>

        <div id="gReviewsWrap"></div>

        <h3 class="section" style="font-size:18px;margin-top:26px">口コミ（${p.reviewCount||0}）</h3>
        <div class="card pad" style="margin-bottom:16px">
          <div class="field" style="margin-bottom:12px">
            <label>評価</label>
            <select id="rating">
              <option value="5">★★★★★ 最高</option>
              <option value="4">★★★★☆ 良い</option>
              <option value="3">★★★☆☆ 普通</option>
              <option value="2">★★☆☆☆ いまひとつ</option>
              <option value="1">★☆☆☆☆ 残念</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:12px">
            <label>コメント（口コミ）</label>
            <textarea id="ctext" placeholder="愛犬との体験を共有しましょう…"></textarea>
          </div>
          <button class="btn btn-primary" id="postReview">口コミを投稿</button>
        </div>
        <div id="reviews"></div>
      </div>`;

    // Google 施設：写真・電話・サイト・評価・営業時間・犬同伴可・口コミを、開いたときに取得（予算内）
    const gpid = p.placeId || (String(id).startsWith("gp_") ? String(id).slice(3) : "");
    if (gpid && window.GPlaces && GPlaces.enabled) enrichFromGoogle(gpid, p, !!hero);

    // mini map (content was re-rendered, so #mini is a fresh node)
    if (p.lat != null) {
      WCMap.ready().then(() => {
        const mini = WCMap.create("mini", { center: { lat: p.lat, lng: p.lng }, zoom: 15, interactive: false });
        mini.addMarker({ lat: p.lat, lng: p.lng }, { title: p.name });
      });
    } else { $("#mini").innerHTML = '<div class="empty sans">位置情報は登録されていません</div>'; }

    // reviews list
    const rv = $("#reviews");
    rv.innerHTML = (d.reviews && d.reviews.length) ? "" : `<p class="sans" style="color:var(--muted)">まだ口コミがありません。最初の一件を投稿しましょう。</p>`;
    (d.reviews || []).forEach(r => {
      const el = document.createElement("div"); el.className = "review";
      el.innerHTML = `
        <div class="head">
          <div class="avatar">${escapeHtml((r.userName||"?")[0])}</div>
          <div><div class="who">${escapeHtml(r.userName||"ユーザー")}</div><div class="when">${timeAgo(r.at)}</div></div>
        </div>
        ${r.rating?`<div class="stars">${stars(r.rating)}</div>`:""}
        <p class="text">${escapeHtml(r.text||"")}</p>`;
      rv.appendChild(el);
    });

    // actions
    $("#checkin").onclick = async (e) => {
      e.target.disabled = true;
      try {
        const { added } = await Store.checkIn(id);
        toast(added ? "チェックインしました！🐾" : "本日はチェックイン済みです。");
      } catch (err) { toast("チェックインに失敗しました。"); }
      await load();
    };
    $("#postReview").onclick = async (e) => {
      const text = $("#ctext").value.trim();
      if (!text) return toast("コメントを入力してください。");
      e.target.disabled = true;
      try { await Store.addReview(id, { rating: +$("#rating").value, text }); toast("口コミを投稿しました。"); }
      catch (err) { toast("投稿に失敗しました。"); e.target.disabled = false; return; }
      await load();
    };

    // 店内同伴の報告（1人1票・タップで変更/取消）
    if (Store.reportIndoor) {
      const yes = $("#repYes"), no = $("#repNo");
      yes.classList.toggle("active", d.myIndoorReport === true);
      no.classList.toggle("active", d.myIndoorReport === false);
      const y = p.indoorYes || 0, n = p.indoorNo || 0;
      $("#repCount").textContent = (y || n)
        ? `みんなの報告：店内OK ${y}件 / テラスのみ・不可 ${n}件`
        : "まだ報告がありません。最初の1件を登録しませんか？";
      const send = async (ok, btn) => {
        btn.disabled = true;
        try { await Store.reportIndoor(id, ok); toast("報告ありがとうございます！🐾"); }
        catch (e) { toast("報告に失敗しました。"); btn.disabled = false; return; }
        await load();
      };
      yes.onclick = () => send(true, yes);
      no.onclick = () => send(false, no);
    }

    // 保存（お気に入り）ボタン
    const sb = $("#saveBtn");
    if (sb && Store.savedIds) {
      const setState = on => { sb.textContent = on ? "♥ 保存済み" : "♡ 保存する"; sb.dataset.on = on ? "1" : ""; };
      Store.savedIds().then(ids => setState(ids.indexOf(p.id) !== -1)).catch(() => {});
      sb.onclick = async () => {
        sb.disabled = true;
        try {
          if (sb.dataset.on) { await Store.unsaveFavorite(p.id); setState(false); toast("保存を解除しました。"); }
          else { await Store.saveFavorite(p.id); setState(true); toast("保存しました ♥"); }
        } catch (e) { toast("保存に失敗しました。"); }
        sb.disabled = false;
      };
    }
  }

  /* Google から表示用の情報を取得して差し込む（保存はしない） */
  const chip = (html, extra) => `<span style="background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:5px 12px;border-radius:999px;${extra||""}">${html}</span>`;
  async function enrichFromGoogle(gpid, p, hasHero) {
    let g = null;
    try { g = await GPlaces.details(gpid, "full"); } catch (e) { g = null; }
    const nameEl = $("#pName"), addrEl = $("#pAddr"), chips = $("#pChips"), extra = $("#gExtra");
    if (!nameEl) return; // 画面が再描画された
    const link = `<a href="${GPlaces.mapsLink(gpid, (g && g.name) || p.name)}" target="_blank" rel="noopener"
       class="btn btn-ghost" style="margin:14px 0 4px">Googleマップで見る（写真・口コミ）↗</a>`;
    if (!g || !g.name) {
      if (!p.name) nameEl.textContent = "Googleの施設";
      extra.innerHTML = `<p class="sans" style="font-size:13px;color:var(--muted);margin:10px 0 0">${
        g && g.blocked === "budget" ? "今月のGoogle情報の表示上限に達したため、詳しい情報はGoogleマップでご覧ください。"
                                    : "Googleから情報を取得できませんでした。"}</p>${link}`;
      return;
    }
    // 分類が未設定なら Google の種別から推定（自社の分類として保持してよい）
    if (p.category === "other" && window.catFromGoogleTypes)
      Data.hintPlace(id, { category: catFromGoogleTypes(g.types, g.primaryType, g.name) });
    else Data.hintPlace(id, { category: p.category });

    nameEl.textContent = g.name;
    if (g.address) addrEl.textContent = "📍 " + g.address.replace(/^日本、/, "");
    document.title = g.name + " — Wan & Co.";
    // 位置を保存していない施設は、表示時に取得した位置でミニ地図を描く
    if (p.lat == null && g.lat != null && $("#mini")) {
      $("#mini").innerHTML = "";
      WCMap.ready().then(() => {
        const mini = WCMap.create("mini", { center: { lat: g.lat, lng: g.lng }, zoom: 15, interactive: false });
        mini.addMarker({ lat: g.lat, lng: g.lng }, { title: g.name });
      });
    }

    const add = [];
    if (p.indoorOk == null && g.allowsDogs === true) add.push(chip("🐕 犬同伴可（Google情報）", "background:#e8f0e9;color:var(--ok);font-weight:600;border-color:transparent"));
    if (p.indoorOk == null && g.allowsDogs === false) add.push(chip("犬同伴不可（Google情報）", "color:var(--danger)"));
    if (g.rating) add.push(chip(`<span style="color:var(--terracotta)">★</span> ${g.rating.toFixed(1)}（${g.ratingCount}件・Google）`));
    if (g.phone && !p.tel) add.push(`<a href="tel:${escapeHtml(g.phone)}" style="background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:5px 12px;border-radius:999px;text-decoration:none">📞 ${escapeHtml(g.phone)}</a>`);
    if (g.website && !p.website) add.push(`<a href="${escapeHtml(g.website)}" target="_blank" rel="noopener" style="background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:5px 12px;border-radius:999px;text-decoration:none">🔗 ウェブサイト</a>`);
    chips.insertAdjacentHTML("beforeend", add.join(""));

    extra.innerHTML = `
      ${g.hours.length ? `<details class="card pad sans" style="margin-top:14px;box-shadow:none">
        <summary style="cursor:pointer;font-weight:700;color:var(--forest)">🕒 営業時間</summary>
        <div style="font-size:13.5px;margin-top:8px;line-height:1.9">${g.hours.map(h => escapeHtml(h)).join("<br>")}</div></details>` : ""}
      ${link}
      <p class="sans" style="font-size:11px;color:var(--muted);margin:2px 0 0;text-align:center">情報提供：Google Maps</p>`;

    // 写真（1枚＝1回）。自社写真が無いときだけ取得
    if (!hasHero && g.photos.length) {
      const url = await GPlaces.photoUrl(g.photos[0].name, 1000);
      const hb = document.getElementById("heroBox");
      if (url && hb) {
        hb.style.backgroundImage = `url('${url}')`;
        if (g.photos[0].attrs.length) hb.insertAdjacentHTML("afterend",
          `<p class="sans" style="font-size:11px;color:var(--muted);text-align:right;margin:4px 16px 0">Photo: ${escapeHtml(g.photos[0].attrs.join(", "))}（Google）</p>`);
      }
    }
    // 口コミ（ワンちゃん関連を優先・投稿日つき）
    renderGoogleReviews(g.reviews);
  }

  // Google 口コミの描画（ワンちゃん関連を優先・投稿年月日つき）
  function renderGoogleReviews(rv) {
    const wrap = document.getElementById("gReviewsWrap");
    if (!wrap) return;
    if (!rv || !rv.length) { wrap.innerHTML = ""; return; }
    const fmt = ms => ms ? new Date(ms).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" }) : "";
    wrap.innerHTML = `
      <h3 class="section" style="font-size:18px;margin-top:26px">Googleの口コミ
        <span class="sans" style="font-size:12px;color:var(--gold)">🐾 ワンちゃん関連を優先</span></h3>
      <div class="card pad" style="margin-bottom:6px">
        ${rv.map(r => `
          <div class="review">
            <div class="head">
              <div class="avatar">${escapeHtml((r.author || "G")[0])}</div>
              <div>
                <div class="who">${escapeHtml(r.author)}${r.dog ? ' <span style="color:var(--gold)">🐾</span>' : ""}</div>
                <div class="when">${fmt(r.dateMs) || escapeHtml(r.rel || "")}</div>
              </div>
            </div>
            ${r.rating ? `<div class="stars">${stars(r.rating)}</div>` : ""}
            <p class="text">${escapeHtml(r.text)}</p>
          </div>`).join("")}
      </div>
      <p class="hint sans" style="margin:0 0 4px">出典: Google マップ</p>`;
  }
</script>
</body>
</html>
