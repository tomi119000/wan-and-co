<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スポット一覧 — Wan &amp; Co.</title>
<link rel="stylesheet" href="assets/style.css?v=20261025b">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">🐾</div>
        <div><h1>Wan &amp; Co.</h1><div class="sub">Find your spot</div></div>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow">Good spot, happy time</div>
      <h2>愛犬と、<br>次の<span class="accent">休日</span>へ。</h2>
      <p>家族の一員と過ごせる、とっておきの場所を。いつもの休日が、もっと特別になる。</p>
    </section>

    <div class="pad">
      <div class="field" style="margin-bottom:12px">
        <input type="search" id="q" placeholder="🔍 施設名・キーワードで検索">
      </div>
      <div class="field" style="margin-bottom:16px">
        <select id="area">
          <!-- エリア選択肢はJSで生成 -->
        </select>
      </div>
      <div class="chips" id="cats" style="margin-bottom:12px"></div>
      <div class="filter-row" style="margin-bottom:22px">
        <button class="toggle-chip" id="indoorOnly">🐕 店内同伴OKのみ</button>
      </div>

      <div class="eyebrow">Curated for you</div>
      <h2 class="section" style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span>首都圏のおすすめスポット</span>
        <span class="sans" style="font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap" id="count"></span>
      </h2>
      <div id="cards"></div>
      <div id="gsection"></div>
    </div>
  </div>

<script src="assets/config.js?v=20261025b"></script>
<script src="assets/data.js?v=20261025b"></script>
<script src="assets/maps.js?v=20261025b"></script>
<script src="assets/gplaces.js?v=20261025b"></script>
<script src="assets/app.js?v=20261025b"></script>
<script>
  let activeCat = "all", q = "", area = "all", indoorOnly = false, places = [];

  // 「店内同伴OKのみ」トグル
  $("#indoorOnly").addEventListener("click", e => {
    indoorOnly = !indoorOnly;
    e.currentTarget.classList.toggle("active", indoorOnly);
    render();
  });

  const catsEl = $("#cats");
  CATEGORIES.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c.key === "all" ? " active" : "");
    b.textContent = `${c.icon} ${c.label}`;
    b.onclick = () => { activeCat = c.key; $$(".chip", catsEl).forEach(x=>x.classList.remove("active")); b.classList.add("active"); render(); };
    catsEl.appendChild(b);
  });

  // エリア絞り込みドロップダウン
  const areaEl = $("#area");
  AREAS.forEach(a => { const o = document.createElement("option"); o.value = a.key; o.textContent = a.label; areaEl.appendChild(o); });
  areaEl.addEventListener("change", e => { area = e.target.value; render(); });

  $("#q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });

  (async () => {
    const user = await Data.ready();
    if (!user) { location.href = "index.html"; return; }
    $("#cards").innerHTML = `<div class="empty"><div class="big">🐾</div>読み込み中…</div>`;
    try { places = await Store.visible(); } catch (e) { places = []; toast("データの取得に失敗しました。"); }
    render();
  })();

  function render() {
    const list = places.filter(p =>
      (activeCat === "all" || p.category === activeCat) &&
      inArea(p, area) &&
      (!indoorOnly || p.indoorOk === true) &&
      (!q || (p.name + " " + (p.address||"")).toLowerCase().includes(q))
    );
    $("#count").textContent = `${list.length.toLocaleString()}件のスポット`;
    const cards = $("#cards");
    renderGoogle();
    if (!list.length) {
      cards.innerHTML = indoorOnly
        ? `<div class="empty"><div class="big">🐕</div>この条件で「店内同伴OK」が確認できたスポットはまだありません。<br>絞り込みを解除するか、別のエリア・カテゴリをお試しください。</div>`
        : `<div class="empty"><div class="big">🔍</div>該当するスポットがありません。</div>`;
      return;
    }
    renderCardsChunked(cards, list.map(p => () => {
      const a = document.createElement("a");
      a.href = `place.html?id=${p.id}`; a.className = "card place-card"; a.style.marginBottom="16px"; a.style.display="block";
      a.innerHTML = placeCardHTML(p);
      return a;
    }));
  }

  /* ---- Google に掲載の施設（区＋カテゴリを選んだときだけ、表示時に取得） ---- */
  let gTurn = 0;
  const gHint = msg => `<div class="card pad sans" style="margin-top:24px;font-size:13.5px;color:var(--sage);box-shadow:none">
      <b style="color:var(--forest)">Googleの施設も探せます</b><br>${msg}</div>`;
  async function renderGoogle() {
    const box = $("#gsection"), turn = ++gTurn;
    box.innerHTML = "";
    if (!(window.GPlaces && GPlaces.enabled) || indoorOnly) return;
    const a = AREAS.find(x => x.key === area);
    const ward = a && a.ward ? GPlaces.wardByName(a.ward) : null;
    if (!ward) { box.innerHTML = gHint("エリアで「港区」「渋谷区」「目黒区」などの区を選ぶと、Googleに掲載されている施設も一覧に表示されます。"); return; }
    if (!GPlaces.QUERIES[activeCat]) { box.innerHTML = gHint("カテゴリ（カフェ・動物病院・公園・サロン・スクール など）を選ぶと、Googleに掲載されている施設も表示されます。"); return; }

    box.innerHTML = `<div class="eyebrow" style="margin-top:30px">From Google</div>
      <h2 class="section" style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span>${ward.name}の${escapeHtml(catLabel(activeCat))}</span>
        <span class="sans" style="font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap" id="gcount"></span></h2>
      <div id="gcards"><div class="empty">Google から読み込み中…</div></div>
      <p class="sans" style="font-size:11.5px;color:var(--muted);margin:8px 2px 0">施設情報の一部は Google Maps から表示しています。</p>`;
    const r = await GPlaces.searchCategory(activeCat, ward);
    if (turn !== gTurn) return; // 条件が変わっていたら破棄
    const ownIds = new Set(places.map(p => p.id));
    let list = r.places.filter(g => !ownIds.has("gp_" + g.pid)).map(g => ({
      id: "gp_" + g.pid, source: "gplace", placeId: g.pid, name: g.name, address: g.address,
      category: activeCat, lat: g.lat, lng: g.lng, cover: "", checkinCount: 0, avg: null, visibility: "public",
    }));
    if (q) list = list.filter(p => (p.name + " " + p.address).toLowerCase().includes(q));
    $("#gcount").textContent = `${list.length}件`;
    const gcards = $("#gcards");
    if (!list.length) {
      gcards.innerHTML = `<div class="empty">${r.blocked === "budget"
        ? "今月のGoogle検索の上限に達したため、来月まで表示を停止しています。"
        : (r.blocked ? "Google から取得できませんでした。" : "該当する施設が見つかりませんでした。")}</div>`;
      return;
    }
    renderCardsChunked(gcards, list.map(p => () => {
      const el = document.createElement("a");
      el.href = `place.html?id=${encodeURIComponent(p.id)}&cat=${p.category}`;
      el.className = "card place-card"; el.style.marginBottom = "16px"; el.style.display = "block";
      el.innerHTML = placeCardHTML(p);
      return el;
    }));
  }
  mountNav("list");
</script>
</body>
</html>
