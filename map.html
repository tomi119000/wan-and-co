<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マップ — Wan &amp; Co.</title>
<link rel="preconnect" href="https://a.tile.openstreetmap.org">
<link rel="preconnect" href="https://b.tile.openstreetmap.org">
<link rel="preconnect" href="https://c.tile.openstreetmap.org">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
<link rel="preload" as="script" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
<link rel="preload" as="style" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/style.css?v=20261025b">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">🐾</div>
        <div>
          <h1>Wan &amp; Co.</h1>
          <div class="sub">Dog-friendly map</div>
        </div>
      </div>
      <button class="iconbtn" id="logout" title="ログアウト">⏻</button>
    </header>

    <div class="pad" style="padding-bottom:10px">
      <div class="chips" id="cats" style="margin-bottom:10px"></div>
      <div class="filter-row">
        <button class="toggle-chip" id="indoorOnly">🐕 店内同伴OKのみ</button>
      </div>
    </div>

    <div class="map-wrap">
      <div id="map"></div>
      <button class="locate-btn" id="locate" title="現在地">📍</button>
    </div>

    <div class="pad" style="padding-bottom:0">
      <button id="findBtn" class="btn btn-ghost" style="display:none">🔍 このエリアの犬同伴スポットを探す</button>
    </div>

    <div class="pad">
      <div class="eyebrow">NEARBY</div>
      <h2 class="section">近くのスポット <span class="sans" style="font-size:14px;color:var(--muted)" id="count"></span></h2>
      <div id="gnote"></div>
      <div id="cards"></div>
    </div>
  </div>
  <div class="scroll-hint" id="scrollHint"><span class="chev">▾</span> 下にスクロールで一覧</div>

<script src="assets/config.js?v=20261025b"></script>
<script src="assets/data.js?v=20261025b"></script>
<script src="assets/maps.js?v=20261025b"></script>
<script src="assets/gplaces.js?v=20261025b"></script>
<script src="assets/app.js?v=20261025b"></script>
<script>
  let activeCat = "all", indoorOnly = false, map = null, places = [];

  // 「店内同伴OKのみ」トグル
  $("#indoorOnly").addEventListener("click", e => {
    indoorOnly = !indoorOnly;
    e.currentTarget.classList.toggle("active", indoorOnly);
    render();
  });

  $("#logout").addEventListener("click", async () => { await Auth.logout(); location.href = "index.html"; });

  /* ---- category chips ---- */
  const catsEl = $("#cats");
  CATEGORIES.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c.key === "all" ? " active" : "");
    b.textContent = `${c.icon} ${c.label}`;
    b.onclick = () => { activeCat = c.key; $$(".chip", catsEl).forEach(x => x.classList.remove("active")); b.classList.add("active"); render(); };
    catsEl.appendChild(b);
  });

  /* ---- boot: require login, then load data + map ---- */
  // 地図はログイン確認・データ取得を待たずに先に描画する（ピンは後から載せる）
  let dataLoaded = false;
  WCMap.ready().then(() => {
    map = WCMap.create("map", { interactive: true, radiusM: WC_CONFIG.INITIAL_RADIUS_M || 500 });
    // 位置情報がすでに許可済みなら、確認ダイアログを出さずに現在地の周辺から表示する
    if (map.showRadius && navigator.permissions && navigator.geolocation) {
      navigator.permissions.query({ name: "geolocation" }).then(st => {
        if (st.state !== "granted") return;
        navigator.geolocation.getCurrentPosition(pos => {
          const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          map.showRadius(here, WC_CONFIG.INITIAL_RADIUS_M || 500);
          if (map.setYou) map.setYou(here);
        }, () => {}, { timeout: 5000, maximumAge: 300000 });
      }).catch(() => {});
    }
    if (dataLoaded) render();
    if (map.onIdle) map.onIdle(() => { if (dataLoaded) render(); }); // 地図を動かすとマーカー・リストが追従
    if (WCMap.canSearch) $("#findBtn").style.display = "flex"; // Google Maps モードのみ
  });

  (async () => {
    $("#cards").innerHTML = `<div class="empty"><div class="big">🐾</div>読み込み中…</div>`;
    const user = await Data.ready();
    if (!user) { location.href = "index.html"; return; }
    // Google 施設の月次インデックス（place_id＋位置のみ・30日以内のものだけ有効）。スポット取得と並行して読む
    const ixP = (window.GPlaces && GPlaces.enabled) ? GPlaces.loadIndex().catch(() => null) : Promise.resolve(null);
    try { places = await Store.visible(); } catch (e) { places = []; toast("データの取得に失敗しました。"); }
    dataLoaded = true;
    render();
    const ix = await ixP;
    if (ix && ix.items.length) {
      const own = new Set(places.map(p => p.id));
      gIndex = ix.items.filter(it => !own.has("gp_" + it.pid));
      render();
    }
  })();

  /* スクロール可能なことを示すヒント（最初のスクロールで消す） */
  window.addEventListener("scroll", () => {
    const h = document.getElementById("scrollHint");
    if (h) { h.style.opacity = "0"; setTimeout(() => h.remove(), 500); }
  }, { once: true, passive: true });

  /* ---- Places API: 実在の犬同伴スポットを探す → 取り込み ---- */
  let findResults = [];
  const gpId = pid => "gp_" + String(pid).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 80);
  // 保存ボタン用: placeId から検索結果を解決（未登録スポットの取り込みに使用）
  window.__saveResolve = pid => findResults.find(g => g.placeId === pid);

  window.__wcImport = async (i) => {
    const g = findResults[i]; if (!g) return;
    toast("施設を取り込み中…");
    try { const id = await Store.importPlace(g); location.href = `place.html?id=${id}`; }
    catch (e) { toast("取り込みに失敗しました。"); }
  };

  const gCat = g => (window.catFromGoogleTypes ? window.catFromGoogleTypes(g.types, g.primaryType, g.name) : "other");
  // カテゴリ絞り込みを反映した検索結果（元の index を保持）
  function filteredDiscovery() {
    if (indoorOnly) return []; // 検索結果は店内同伴の情報を持たないため除外
    return findResults.map((g, i) => ({ g, i })).filter(({ g }) => activeCat === "all" || gCat(g) === activeCat);
  }
  // 検索結果を「カード表示用の疑似スポット」に変換
  function discoveryToPlace(g) {
    return {
      name: g.name, category: gCat(g), address: g.address, desc: g.desc || "",
      cover: g.photoUrl || "", placeId: g.placeId, source: "places",
      visibility: "public", checkinCount: 0, avg: null,
    };
  }

  // 発見マーカー（黒ピン）を描画。render() から毎回呼ばれるので、
  // カテゴリ切替や詳細からの「戻る」でも残り続ける。
  function addFindMarkers() {
    if (!map) return;
    filteredDiscovery().forEach(({ g, i }) => {
      map.addMarker({ lat: g.lat, lng: g.lng }, {
        pin: "find", title: g.name,
        html: `<div style="min-width:190px;font-family:sans-serif">
            <b style="font-size:14px">${escapeHtml(g.name)}</b><br>
            <span style="color:#7d7a72;font-size:12px">${escapeHtml(g.address || "")}</span><br>
            <button onclick="__wcImport(${i})" style="margin-top:8px;background:#1c1f26;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px">この施設で口コミ・チェックイン</button>
          </div>`,
      });
    });
  }

  // 検索結果を保存／復元（詳細ページから戻っても黒ピンを保持）
  function saveDiscovery() {
    try { sessionStorage.setItem("wc_discovery", JSON.stringify({ results: findResults, center: map.center(), ts: Date.now() })); } catch (e) {}
  }
  function restoreDiscovery() {
    try {
      const raw = sessionStorage.getItem("wc_discovery"); if (!raw) return;
      const d = JSON.parse(raw);
      if (!d.results || !d.results.length || (Date.now() - d.ts) > 30 * 60 * 1000) return;
      findResults = d.results.filter(g => !places.some(p => p.id === gpId(g.placeId)));
      if (d.center && map) map.setView(d.center, 14);
      render(); // 黒ピンを再描画
    } catch (e) {}
  }

  $("#findBtn").addEventListener("click", async () => {
    if (!map || !WCMap.canSearch) return;
    const btn = $("#findBtn"); btn.disabled = true; btn.textContent = "検索中…";
    try {
      const results = await WCMap.searchDogFriendly(map.center(), 4000);
      // 既にDB(places)に無いものだけ新規に自動保存
      const fresh = results.filter(g => !places.some(p => p.id === gpId(g.placeId)));
      btn.textContent = "保存中…";
      const imported = await Promise.all(fresh.map(async g => {
        try { return { g, id: await Store.importPlace(g) }; } catch (e) { return null; } // 重複は自動スキップ
      }));
      imported.filter(Boolean).forEach(({ g, id }) => places.push({
        id, name: g.name, category: gCat(g), address: g.address, desc: g.desc || "",
        cover: g.photoUrl || "", placeId: g.placeId, source: "places", visibility: "public",
        checkinCount: 0, reviewCount: 0, avg: null, lat: g.lat, lng: g.lng,
      }));
      const added = imported.filter(Boolean).length;
      render(); // 保存済みスポット（gold ピン）として表示
      const dup = results.length - fresh.length;
      toast(results.length
        ? `${added}件を保存しました${dup ? `（${dup}件は登録済み）` : ""}🐾`
        : "このエリアでは候補が見つかりませんでした");
    } catch (e) {
      toast(e.message || "検索に失敗しました。");
    }
    btn.disabled = false; btn.textContent = "🔍 このエリアの犬同伴スポットを探す";
  });

  function filtered() {
    return places.filter(p =>
      (activeCat === "all" || p.category === activeCat) &&
      (!indoorOnly || p.indoorOk === true));
  }

  // 地図に表示されている範囲内か（＝ピンが見えているか）
  function inView(lat, lng) {
    if (!map || !map.inBounds) return true; // 地図準備前は全件
    if (lat == null) return false;           // 位置情報が無い＝ピンが無い
    return map.inBounds(lat, lng);
  }

  function render() {
    if (!dataLoaded) return;
    // マーカー（カテゴリ＋表示範囲で絞り込み。大量データでも軽く保つ）
    if (map) {
      map.clearMarkers();
      filtered().forEach(p => {
        if (p.lat == null || !inView(p.lat, p.lng)) return;
        map.addMarker({ lat: p.lat, lng: p.lng }, {
          title: p.name,
          html: `<b>${escapeHtml(p.name)}</b><br>${catLabel(p.category)}<br>
            <a href="place.html?id=${p.id}" style="color:#c96542">詳細を見る →</a>`,
        });
      });
    }
    addFindMarkers(); // 発見マーカー（黒ピン）を base マーカーの上に重ねる
    addGoogleMarkers();
    renderCards();
  }

  /* Google 施設のピン（濃色）。店名はタップしたときだけ取得（予算内） */
  let gIndex = [];
  const gInView = () => gIndex.filter(it =>
    (activeCat === "all" || it.cat === activeCat) && !indoorOnly && inView(it.lat, it.lng));
  function addGoogleMarkers() {
    if (!map || !gIndex.length) return;
    gInView().forEach(it => {
      const href = `place.html?id=gp_${encodeURIComponent(it.pid)}&cat=${it.cat}`;
      const mk = map.addMarker({ lat: it.lat, lng: it.lng }, {
        pin: "find", title: catLabel(it.cat),
        html: `<span class="sans" style="font-size:12px;color:#7a8075">${catLabel(it.cat)}・Google</span><br><b>読み込み中…</b>`,
        onClick: async () => {
          const d = await GPlaces.details(it.pid, "basic").catch(() => null);
          const name = d && d.name ? escapeHtml(d.name) : "Googleの施設";
          const addr = d && d.address ? `<br><span style="font-size:12px;color:#7a8075">${escapeHtml(areaSummary(d.address))}</span>` : "";
          if (mk && mk.setPopupContent) mk.setPopupContent(
            `<span class="sans" style="font-size:12px;color:#7a8075">${catLabel(it.cat)}・Google</span><br><b>${name}</b>${addr}<br>
             <a href="${href}" style="color:#c96542">詳細を見る →</a>`);
        },
      });
    });
  }

  // 「近くのスポット」は、地図に表示されている範囲（＝ピンが見える範囲）の施設だけを表示
  function renderCards() {
    const reg = filtered().filter(p => inView(p.lat, p.lng));
    const disc = filteredDiscovery().filter(({ g }) => inView(g.lat, g.lng));
    // 見出しの件数＝地図上のピンの総数（登録スポット＋Google施設）。内訳を下に表示
    const listed = reg.length + disc.length;
    const gn = gIndex.length ? gInView().length : 0;
    $("#count").textContent = `（${(listed + gn).toLocaleString()}件）`;
    const cards = $("#cards");
    // Google 施設は一覧に並べずピンのみ（店名の取得コストを抑えるため）
    $("#gnote").innerHTML = gn ? `<div class="card pad sans" style="margin:0 0 16px;box-shadow:none;font-size:13.5px;color:var(--sage);line-height:1.8">
        <div style="display:flex;justify-content:space-between;gap:10px"><span><span style="color:#c96542">●</span> Wan &amp; Co. のスポット</span><b style="color:var(--forest)">${listed.toLocaleString()}件<span style="font-weight:400;color:var(--muted)">（下に一覧）</span></b></div>
        <div style="display:flex;justify-content:space-between;gap:10px"><span><span style="color:#2b2f3a">●</span> Googleに掲載の施設</span><b style="color:var(--forest)">${gn.toLocaleString()}件<span style="font-weight:400;color:var(--muted)">（地図のピン）</span></b></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">Googleの施設は濃い色のピンをタップすると表示されます。一覧で見るには「さがす」で区とカテゴリを選んでください。</div></div>` : "";
    if (!reg.length && !disc.length) {
      cards.innerHTML = indoorOnly
        ? `<div class="empty"><div class="big">🐕</div>この範囲で「店内同伴OK」が確認できたスポットはありません。<br>地図を動かすか、絞り込みを解除してください。</div>`
        : gn
          ? `<div class="empty"><div class="big">🐾</div>この範囲に Wan &amp; Co. のスポットはありません。<br>Googleの施設は地図のピンから確認できます。</div>`
          : `<div class="empty"><div class="big">🐾</div>この範囲にスポットがありません。<br>地図を動かすか、縮小してみてください。</div>`;
      return;
    }
    const makers = [
      // 登録済みスポット（詳細ページへ）
      ...reg.map(p => () => {
        const a = document.createElement("a");
        a.href = `place.html?id=${p.id}`; a.className = "card place-card";
        a.style.marginBottom = "16px"; a.style.display = "block";
        a.innerHTML = placeCardHTML(p);
        return a;
      }),
      // 検索でピンが立った未登録スポット（タップで取り込み→詳細へ）
      ...disc.map(({ g, i }) => () => {
        const a = document.createElement("a");
        a.href = "#"; a.className = "card place-card";
        a.style.marginBottom = "16px"; a.style.display = "block";
        a.innerHTML = placeCardHTML(discoveryToPlace(g));
        a.addEventListener("click", e => { e.preventDefault(); __wcImport(i); });
        return a;
      }),
    ];
    renderCardsChunked(cards, makers);
  }

  /* ---- geolocation ---- */
  $("#locate").addEventListener("click", () => {
    if (!map) return;
    if (!navigator.geolocation) return toast("位置情報が利用できません。");
    toast("現在地を取得中…");
    navigator.geolocation.getCurrentPosition(
      pos => {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (map.showRadius) map.showRadius(loc, WC_CONFIG.INITIAL_RADIUS_M || 500); else map.setView(loc, 15);
        map.setYou(loc);
      },
      () => toast("現在地を取得できませんでした。"),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });

  mountNav("map");
</script>
</body>
</html>
